name: KNO-126 Linux Diagnostic Gate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]
    paths:
      - '.github/workflows/kno126-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: kno126-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-single-method:
    name: Job A — Single Test Method in Isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact feature-branch commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact feature-branch commit SHA (fail-closed)
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          EXPECTED_SHA="${{ github.event.pull_request.head.sha }}"
          echo "Actual SHA:   '$ACTUAL_SHA'"
          echo "Expected SHA: '$EXPECTED_SHA'"
          if [ -z "$ACTUAL_SHA" ] || [ -z "$EXPECTED_SHA" ] || [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: SHA verification failed! Actual: '$ACTUAL_SHA', Expected: '$EXPECTED_SHA'"
            exit 1
          fi
          echo "SUCCESS: Commit SHA matches expected head SHA."

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Environment Diagnostics
        run: |
          echo "=== OS & JDK DETAILS ==="
          uname -a
          java -version
          ./gradlew --version

      - name: Execute Isolated Single Method Test
        run: ./gradlew :app:testDebugUnitTest --tests "com.sysadmindoc.alarmclock.service.AlarmGenerationTest.coldStartRestartSnoozeAwaitsDataStoreInitialLoadAndSnoozesAlarm" --no-daemon

      - name: Upload Single-Method JUnit XML Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: single-method-junit-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 7

  complete-generation-class:
    name: Job B — Complete AlarmGenerationTest Class
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact feature-branch commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact feature-branch commit SHA (fail-closed)
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          EXPECTED_SHA="${{ github.event.pull_request.head.sha }}"
          echo "Actual SHA:   '$ACTUAL_SHA'"
          echo "Expected SHA: '$EXPECTED_SHA'"
          if [ -z "$ACTUAL_SHA" ] || [ -z "$EXPECTED_SHA" ] || [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: SHA verification failed! Actual: '$ACTUAL_SHA', Expected: '$EXPECTED_SHA'"
            exit 1
          fi
          echo "SUCCESS: Commit SHA matches expected head SHA."

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Environment Diagnostics
        run: |
          echo "=== OS & JDK DETAILS ==="
          uname -a
          java -version
          ./gradlew --version

      - name: Execute Complete AlarmGenerationTest Class
        run: ./gradlew :app:testDebugUnitTest --tests "com.sysadmindoc.alarmclock.service.AlarmGenerationTest" --no-daemon

      - name: Upload Full-Class JUnit XML Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-class-junit-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 7
