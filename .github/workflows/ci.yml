name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_TOOL_OPTIONS: "-Duser.language=en -Duser.country=US -Duser.timezone=UTC"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run CI Verification Gates
        run: ./gradlew app:testDebugUnitTest app:assembleDebug app:lintDebug app:verifyLocalizedPrimaryScreens app:verifyRoomSchemaExports verifyReleaseMetadata --no-daemon
